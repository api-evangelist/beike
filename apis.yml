name: Beike
description: 'Beike (KE Holdings Inc.) is China''s largest integrated online-and-offline
  platform for housing transactions and services, connecting home buyers, sellers,
  renters, and real estate agents. It operates the Beike (贝壳) platform and the Lianjia
  (链家) brokerage brand, along with businesses spanning existing-home and new-home
  transactions, home rentals, and home renovation and furnishing. Its Agent Cooperation
  Network (ACN) lets brokerages and agents share listings and commissions across a
  standardized workflow. KE Holdings is dual-listed on the New York Stock Exchange
  (NYSE: BEKE) and the Hong Kong Stock Exchange (HKEX: 2423) and is headquartered in
  Beijing. This API Evangelist profile was created from venture-portfolio sourcing
  and enriched via the pipeline; Beike operates consumer-facing housing web and mobile
  properties and does not currently publish a public developer API program.'
